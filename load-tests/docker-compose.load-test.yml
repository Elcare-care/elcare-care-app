version: '3.8'

# ── Isolated load-test environment ────────────────────────────────────────────
#
# Brings up a throwaway PostgreSQL + Redis pair that the load-test seed script
# and k6 harness target directly.  The indexer API is started as a separate
# service so we can drive it with HTTP traffic.
#
# Usage:
#   docker compose -f load-tests/docker-compose.load-test.yml up -d --wait
#   npm run load-test:seed          # populate fixtures
#   npm run load-test               # run the full suite
#   docker compose -f load-tests/docker-compose.load-test.yml down -v

services:
  lt-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ltuser
      POSTGRES_PASSWORD: ltpass
      POSTGRES_DB: marketplace_lt
      # Higher than production default to absorb connection-pool stress tests.
      POSTGRES_MAX_CONNECTIONS: 200
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - synchronous_commit=off     # latency-optimised for load testing
    ports:
      - "5433:5432"
    volumes:
      - lt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltuser"]
      interval: 5s
      timeout: 3s
      retries: 10

  lt-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - lt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lt-indexer:
    build:
      context: ../indexer
      dockerfile: Dockerfile
    depends_on:
      lt-db:
        condition: service_healthy
      lt-redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ltuser:ltpass@lt-db:5432/marketplace_lt
      DB_CONNECTION_LIMIT: "20"
      DB_WRITE_CONNECTION_LIMIT: "5"
      DB_POOL_TIMEOUT: "10"
      DB_STATEMENT_TIMEOUT: "15000"
      REDIS_URL: redis://lt-redis:6379
      REDIS_CACHE_TTL_SECONDS: "10"
      PORT: "4000"
      STELLAR_NETWORK: testnet
      # Point at a no-op stub — the load test drives events directly via the
      # seed script, so RPC polling is disabled.
      STELLAR_RPC_URL: http://lt-rpc-stub:9000
      MARKETPLACE_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB2OC
      TRACKED_CONTRACTS: '[{"id":"CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB2OC","type":"marketplace","label":"lt-marketplace","startLedger":0}]'
      CONFIRMATION_DEPTH: "0"
      KEEPER_ENABLED: "false"
      GAP_REPAIR_ENABLED: "false"
      NODE_ENV: production
    ports:
      - "4001:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  lt_pg_data:
  lt_redis_data:
