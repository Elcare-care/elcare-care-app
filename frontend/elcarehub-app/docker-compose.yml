version: '3.8'

services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Next.js build-time environment variables
      - NEXT_PUBLIC_CONTRACT_ID=${NEXT_PUBLIC_CONTRACT_ID}
      - NEXT_PUBLIC_LAUNCHPAD_CONTRACT_ID=${NEXT_PUBLIC_LAUNCHPAD_CONTRACT_ID}
      - NEXT_PUBLIC_STELLAR_NETWORK=${NEXT_PUBLIC_STELLAR_NETWORK:-testnet}
      - NEXT_PUBLIC_STELLAR_RPC_URL=${NEXT_PUBLIC_STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      - NEXT_PUBLIC_STELLAR_HORIZON_URL=${NEXT_PUBLIC_STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      - NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE=${NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      - NEXT_PUBLIC_INDEXER_URL=${NEXT_PUBLIC_INDEXER_URL:-http://localhost:4000}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}
      - NEXT_PUBLIC_PINATA_GATEWAY=${NEXT_PUBLIC_PINATA_GATEWAY:-https://gateway.pinata.cloud}
      # Sentry configuration (optional - for error tracking)
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT=${SENTRY_PROJECT}
      # Build metadata
      - BUILD_SHA=${BUILD_SHA:-unknown}
      - BUILD_TIME=${BUILD_TIME:-unknown}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - INDEXER_API_VERSION=${INDEXER_API_VERSION:-1.0.0}
      - EVENT_SCHEMA_VERSION=${EVENT_SCHEMA_VERSION:-1}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s