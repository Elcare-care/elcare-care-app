version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace_indexer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/marketplace_indexer?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - STELLAR_NETWORK=testnet
      - STELLAR_RPC_URL=https://soroban-testnet.stellar.org
      - STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org
      - MARKETPLACE_CONTRACT_ID=${MARKETPLACE_CONTRACT_ID}
      - LAUNCHPAD_CONTRACT_ID=${LAUNCHPAD_CONTRACT_ID}
      - POLL_INTERVAL_MS=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - HEALTH_DETAILS_TOKEN=${HEALTH_DETAILS_TOKEN:-}
    ports:
      - "4000:4000"
    healthcheck:
      # Liveness: always returns 200 when the process is up and all deps are ok
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
