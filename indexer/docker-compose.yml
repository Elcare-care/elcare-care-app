version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=marketplace_indexer
      # Raise the connection ceiling so two Prisma pools (read=10 + write=3)
      # plus pgAdmin / migration tooling never hit the default limit of 100.
      # Total pool claim is ~13; 50 leaves comfortable headroom for operators.
      - POSTGRES_MAX_CONNECTIONS=50
      # shared_buffers = 25 % of RAM is the PostgreSQL recommendation.
      # 256 MB is appropriate for a 1 GB container; tune up for larger hosts.
      - POSTGRES_SHARED_BUFFERS=256MB
    # The command override applies the same settings at the server level so
    # they survive configuration reloads (ALTER SYSTEM is not used here to
    # keep the image stateless).
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/marketplace_indexer?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - STELLAR_NETWORK=testnet
      - STELLAR_RPC_URL=https://soroban-testnet.stellar.org
      - STELLAR_HORIZON_URL=https://horizon-testnet.stellar.org
      - MARKETPLACE_CONTRACT_ID=${MARKETPLACE_CONTRACT_ID}
      - LAUNCHPAD_CONTRACT_ID=${LAUNCHPAD_CONTRACT_ID}
      - POLL_INTERVAL_MS=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - HEALTH_DETAILS_TOKEN=${HEALTH_DETAILS_TOKEN:-}
      # Structured logging (see README.md "Logging" section).
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    ports:
      - "4000:4000"
    healthcheck:
      # Liveness: always returns 200 when the process is up and all deps are ok
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    # ── Log shipping (documentation only — disabled by default) ────────────────
    #
    # The indexer emits one JSON object per line on stdout, which is exactly
    # what the docker log drivers below expect. Uncomment ONE of the examples
    # to ship logs off-box instead of relying on `docker logs` / the default
    # `json-file` driver. See README.md → "Logging" → "Log Shipping" for the
    # full walkthrough (env vars, IAM permissions, Datadog Agent setup, etc).
    #
    # Example: AWS CloudWatch Logs via the built-in `awslogs` driver.
    # Requires the CloudWatch Logs group to already exist and AWS credentials
    # to be available to the Docker daemon (e.g. an EC2 instance role).
    # logging:
    #   driver: awslogs
    #   options:
    #     awslogs-region: us-east-1
    #     awslogs-group: /elcarehub/indexer
    #     awslogs-stream: indexer-${HOSTNAME:-local}
    #     awslogs-create-group: "true"
    #
    # Example: Datadog, via the local `json-file` driver plus the Datadog
    # Agent's Docker log collection (the Agent tails container log files
    # directly — no per-service driver config needed beyond labels).
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
    # labels:
    #   com.datadoghq.ad.logs: '[{"source":"nodejs","service":"elcarehub-indexer"}]'

volumes:
  postgres_data:
  redis_data:
