apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
  namespace: default
  annotations:
    description: "Service account for ELCARE-HUB indexer deployment"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: indexer
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: indexer
  namespace: default
subjects:
- kind: ServiceAccount
  name: indexer
  namespace: default
roleRef:
  kind: Role
  name: indexer
  apiGroup: rbac.authorization.k8s.io
