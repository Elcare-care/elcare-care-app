apiVersion: v1
kind: Secret
metadata:
  name: indexer-secrets
type: Opaque
stringData:
  # Database credentials (replace with actual values)
  database-url: "postgresql://user:password@host:5432/database?schema=public"
  
  # Redis connection (replace with actual values)
  redis-url: "redis://host:6379"
  
  # Stellar RPC endpoint (replace with actual values)
  stellar-rpc-url: "https://soroban-testnet.stellar.org"
  
  # Marketplace contract ID (replace with actual value)
  marketplace-contract-id: "C123456789012345678901234567890123456789012345678901234"
  
  # Operator token (generate with: openssl rand -hex 32)
  operator-token: "your-operator-token-minimum-32-characters-long"
  
  # Pinata JWT (replace with actual value)
  pinata-jwt: "your-pinata-jwt-token"

# Note: Never commit this file to version control.
# Use sealed-secrets or external secret management (Vault, AWS Secrets Manager, etc.)
# for production deployments.
