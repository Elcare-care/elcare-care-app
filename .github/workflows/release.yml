name: Release

# ── Trigger policy ─────────────────────────────────────────────────────────────
#
# Tag push (v*) — the canonical release trigger. Builds every release
# artifact (contract WASM, ABI package, indexer image, frontend build),
# checksums and signs them, and publishes a GitHub Release for the tag.
#
# workflow_dispatch — manual run for testing the pipeline against an
# arbitrary ref without cutting a tag. Artifacts are built and uploaded as
# workflow artifacts, but no GitHub Release is created (there is no tag to
# attach one to).
#
# Signing is entirely keyless/OIDC-based:
#   - actions/attest-build-provenance — GitHub-native Sigstore attestations,
#     tied to this workflow's OIDC identity. No secrets required.
#   - cosign sign-blob --yes (Sigstore keyless) — signs SHA256SUMS using the
#     same ambient GitHub Actions OIDC token. No secrets required.
#
# See docs/RELEASE_VERIFICATION.md for the full verification procedure.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Optional note describing why this manual run was triggered (no release is published for non-tag runs)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 20
  ARTIFACT_DIR: release-artifacts

jobs:
  release:
    name: Build, sign, and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create artifact directories
        run: |
          mkdir -p "${ARTIFACT_DIR}/wasm" "${ARTIFACT_DIR}/abi" "${ARTIFACT_DIR}/frontend" "${ARTIFACT_DIR}/indexer"

      # ── Contract WASM ──────────────────────────────────────────────────────
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: rustup target add wasm32v1-none
      - name: Record Rust toolchain version
        id: rustver
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Build contract WASM (release profile)
        run: |
          cargo build --target wasm32v1-none --release \
            -p collection-nft-erc721 \
            -p collection-nft-erc1155 \
            -p lazy-mint-erc721 \
            -p lazy-mint-erc1155 \
            -p soroban-marketplace \
            -p soroban-launchpad

      - name: Collect WASM artifacts
        run: |
          cp target/wasm32v1-none/release/collection_nft_erc721.wasm "${ARTIFACT_DIR}/wasm/"
          cp target/wasm32v1-none/release/collection_nft_erc1155.wasm "${ARTIFACT_DIR}/wasm/"
          cp target/wasm32v1-none/release/lazy_mint_erc721.wasm "${ARTIFACT_DIR}/wasm/"
          cp target/wasm32v1-none/release/lazy_mint_erc1155.wasm "${ARTIFACT_DIR}/wasm/"
          cp target/wasm32v1-none/release/soroban_marketplace.wasm "${ARTIFACT_DIR}/wasm/"
          cp target/wasm32v1-none/release/soroban_launchpad.wasm "${ARTIFACT_DIR}/wasm/"
          ls -la "${ARTIFACT_DIR}/wasm/"

      # ── ABI package ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and validate contract-abi package
        working-directory: packages/contract-abi
        run: |
          npm install
          npm run build
          npm run validate

      - name: Collect ABI artifacts
        run: |
          cp packages/contract-abi/abi.json "${ARTIFACT_DIR}/abi/"
          tar -czf "${ARTIFACT_DIR}/abi/contract-abi-dist.tar.gz" -C packages/contract-abi dist

      # ── Frontend build ─────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend/elcarehub-app
        run: npm ci

      - name: Build frontend
        working-directory: frontend/elcarehub-app
        env:
          CI: true
        run: npm run build

      - name: Collect frontend artifact
        run: |
          tar -czf "${ARTIFACT_DIR}/frontend/frontend-next-build-${{ steps.meta.outputs.tag }}.tar.gz" \
            -C frontend/elcarehub-app .next

      # ── Indexer container image ───────────────────────────────────────────
      # No container registry secret is configured for this repository, so the
      # image is built and signed locally rather than pushed. Once a registry
      # is wired up, the operator's follow-up step is to `docker push` the
      # same image and re-run `cosign sign` / `attest-build-provenance`
      # against the pushed registry digest (see docs/RELEASE_VERIFICATION.md).
      - name: Build indexer image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "elcarehub-indexer:${{ steps.meta.outputs.tag }}" \
            indexer

      - name: Capture indexer image digest and tarball
        run: |
          docker inspect --format='{{.Id}}' "elcarehub-indexer:${{ steps.meta.outputs.tag }}" \
            > "${ARTIFACT_DIR}/indexer/image-id.txt"
          docker save "elcarehub-indexer:${{ steps.meta.outputs.tag }}" \
            -o "${ARTIFACT_DIR}/indexer/elcarehub-indexer-${{ steps.meta.outputs.tag }}.tar"

      # ── Checksums ──────────────────────────────────────────────────────────
      - name: Generate SHA256SUMS
        working-directory: ${{ env.ARTIFACT_DIR }}
        run: |
          find . -type f | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # ── Provenance metadata ────────────────────────────────────────────────
      - name: Write PROVENANCE.json
        run: |
          node --version > /tmp/node_version.txt
          cat > "${ARTIFACT_DIR}/PROVENANCE.json" <<EOF
          {
            "source": {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "tag": "${{ steps.meta.outputs.tag }}",
              "commit": "${{ github.sha }}",
              "commit_short": "${GITHUB_SHA::12}"
            },
            "build": {
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "triggered_by": "${{ github.event_name }}",
              "actor": "${{ github.actor }}",
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            "toolchain": {
              "rust": "${{ steps.rustver.outputs.version }}",
              "node": "$(cat /tmp/node_version.txt)"
            },
            "signing": {
              "mechanisms": [
                "actions/attest-build-provenance (GitHub Sigstore-backed keyless attestation)",
                "cosign sign-blob --yes (Sigstore keyless, GitHub Actions OIDC identity)"
              ],
              "checksum_file": "SHA256SUMS"
            }
          }
          EOF
          cat "${ARTIFACT_DIR}/PROVENANCE.json"

      # ── Signing: GitHub-native keyless attestations ───────────────────────
      - name: Attest build provenance for all artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            ${{ env.ARTIFACT_DIR }}/wasm/*.wasm
            ${{ env.ARTIFACT_DIR }}/abi/abi.json
            ${{ env.ARTIFACT_DIR }}/abi/contract-abi-dist.tar.gz
            ${{ env.ARTIFACT_DIR }}/frontend/*.tar.gz
            ${{ env.ARTIFACT_DIR }}/indexer/*.tar
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
            ${{ env.ARTIFACT_DIR }}/PROVENANCE.json

      # ── Signing: cosign keyless (second, independently-verifiable format) ─
      - uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS with cosign (keyless)
        working-directory: ${{ env.ARTIFACT_DIR }}
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS

      # ── Publish ─────────────────────────────────────────────────────────────
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.meta.outputs.tag }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT_DIR }}/wasm/*.wasm
            ${{ env.ARTIFACT_DIR }}/abi/abi.json
            ${{ env.ARTIFACT_DIR }}/abi/contract-abi-dist.tar.gz
            ${{ env.ARTIFACT_DIR }}/frontend/*.tar.gz
            ${{ env.ARTIFACT_DIR }}/indexer/*.tar
            ${{ env.ARTIFACT_DIR }}/indexer/image-id.txt
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS.sig
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS.pem
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS.bundle
            ${{ env.ARTIFACT_DIR }}/PROVENANCE.json
