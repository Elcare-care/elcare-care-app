name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: rustup target add wasm32v1-none
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo build --target wasm32v1-none --release -p collection-nft-erc721 -p collection-nft-erc1155 -p lazy-mint-erc721 -p lazy-mint-erc1155
      - run: cargo test --workspace
      # Issue #841 — collection conformance suite is a required merge gate.
      # Do not remove or #[ignore] tests in contracts/e2e-conformance without
      # an accompanying justification comment in the same PR.
      - name: Collection conformance suite
        run: cargo test -p e2e-conformance

  # ── Contract error catalog coverage gate (Issue #475) ────────────────────────
  # Fails when a Rust error variant has no client-side catalog mapping, when a
  # mapping is stale (code renumbered), or when a non-retryable financial error
  # lacks an explicit operator action.
  contract-error-coverage:
    name: Contract Error Catalog Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate error catalog coverage
        run: node scripts/contract-errors/validate-error-coverage.mjs

  # ── Event schema registry parity gate (Issue #846) ──────────────────────────
  # Blocks merge when a struct in contracts/soroban-marketplace/src/events.rs
  # carries a `schema_version: u32` field but the indexer's schema registry has
  # no entry for its event type, or the entry does not mark `schema_version`
  # optional — either way one decoder could not handle both the historical
  # (implicit version 0) and the post-upgrade shapes of that event.
  event-schema-lint:
    name: Event Schema Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every versioned contract event has an optional schema_version entry
        run: node scripts/check-event-schemas.mjs

  # ── Migration safety gate ────────────────────────────────────────────────────
  # Runs on every push/PR that touches migration files.
  # Blocks merge when destructive SQL patterns are detected (DROP TABLE,
  # DROP COLUMN, ALTER COLUMN TYPE, RENAME TABLE/COLUMN, TRUNCATE, bulk DELETE).
  # See scripts/migrations/lint-migration.sh for the full pattern list.
  # See docs/MIGRATION_GUIDE.md for the expand-contract procedure.
  migration-safety:
    name: Migration Safety Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so git diff against origin/main works correctly
          fetch-depth: 0

      - name: Lint all migration SQL files
        run: |
          chmod +x scripts/migrations/lint-migration.sh
          bash scripts/migrations/lint-migration.sh

      - name: Zero-downtime assessment for changed migrations
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/migrations/check-zero-downtime.sh
          BASE="${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" -- '*.sql' \
            | grep "indexer/prisma/migrations/" || true)
          if [[ -z "$CHANGED" ]]; then
            echo "No migration SQL files changed in this PR."
            exit 0
          fi
          OVERALL=0
          while IFS= read -r f; do
            echo ""
            echo "────────────────────────────────────────────"
            bash scripts/migrations/check-zero-downtime.sh "$f" || OVERALL=1
          done <<< "$CHANGED"
          # Zero-downtime check is advisory only — does NOT block merge by
          # itself.  Blocking is enforced by lint-migration.sh (ERROR patterns).
          # The assessment report is surfaced in the PR run summary for review.
          exit 0

      - name: Verify example expand-contract migration passes linter
        run: |
          bash scripts/migrations/lint-migration.sh \
            indexer/prisma/migrations/20260827000000_example_expand_contract/migration.sql

  # ── Configuration validation gate ────────────────────────────────────────────
  # Runs on every push/PR to ensure configuration is valid before deployment.
  # This job validates that all required environment variables are present and
  # conform to expected formats (network passphrase, contract IDs, URLs, etc.).
  # Uses safe, non-secret placeholder values — no production credentials.
  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build config package
        run: |
          cd packages/config
          npm ci
          npm run build

      - name: Run configuration validation
        env:
          # Safe non-secret placeholder values — no production credentials
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          MARKETPLACE_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          INDEXER_URL: http://localhost:4000
          OPERATOR_TOKEN: valid-operator-token-minimum-32-characters-long
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          REDIS_URL: redis://localhost:6379
          PINATA_GATEWAY: https://gateway.pinata.cloud
        run: node scripts/validate-config.js

  # ── Advisory exceptions register gate (Reliability, Security & Operations) ──
  # Fails when an exception in docs/advisory-exceptions.md is expired, lacks an
  # owner, or when a .cargo/audit.toml ignore has no documented exception row.
  # Read-only: parses files only — no network, no secrets, no deployments.
  advisory-exceptions:
    name: Advisory Exceptions Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate advisory exceptions register
        run: node scripts/check-advisory-exceptions.mjs

  # ── Contract ID / network settings consistency gate (Reliability, Security ──
  # & Operations) — fails when contract IDs or Stellar network settings disagree
  # across frontend, indexer, shared config, or the deploy scripts' hardcoded
  # --network-passphrase. Read-only: parses committed templates + deploy scripts
  # only — no network, no secrets, no deployments.
  contract-network-consistency:
    name: Contract / Network Config Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check contract IDs & network settings consistency
        run: node scripts/check-contract-network-consistency.mjs
