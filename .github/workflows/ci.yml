name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: rustup target add wasm32v1-none
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo build --target wasm32v1-none --release -p collection-nft-erc721 -p collection-nft-erc1155 -p lazy-mint-erc721 -p lazy-mint-erc1155
      - run: cargo test --workspace
      # Issue #841 — collection conformance suite is a required merge gate.
      # Do not remove or #[ignore] tests in contracts/e2e-conformance without
      # an accompanying justification comment in the same PR.
      - name: Collection conformance suite
        run: cargo test -p e2e-conformance

  # ── Contract error catalog coverage gate (Issue #475) ────────────────────────
  # Fails when a Rust error variant has no client-side catalog mapping, when a
  # mapping is stale (code renumbered), or when a non-retryable financial error
  # lacks an explicit operator action.
  contract-error-coverage:
    name: Contract Error Catalog Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate error catalog coverage
        run: node scripts/contract-errors/validate-error-coverage.mjs

  # ── Event schema registry parity gate (Issue #846) ──────────────────────────
  # Blocks merge when a struct in contracts/soroban-marketplace/src/events.rs
  # carries a `schema_version: u32` field but the indexer's schema registry has
  # no entry for its event type, or the entry does not mark `schema_version`
  # optional — either way one decoder could not handle both the historical
  # (implicit version 0) and the post-upgrade shapes of that event.
  event-schema-lint:
    name: Event Schema Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every versioned contract event has an optional schema_version entry
        run: node scripts/check-event-schemas.mjs

  # ── Migration safety gate ────────────────────────────────────────────────────
  # Runs on every push/PR that touches migration files.
  # Blocks merge when destructive SQL patterns are detected (DROP TABLE,
  # DROP COLUMN, ALTER COLUMN TYPE, RENAME TABLE/COLUMN, TRUNCATE, bulk DELETE).
  # See scripts/migrations/lint-migration.sh for the full pattern list.
  # See docs/MIGRATION_GUIDE.md for the expand-contract procedure.
  migration-safety:
    name: Migration Safety Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so git diff against origin/main works correctly
          fetch-depth: 0

      - name: Lint all migration SQL files
        run: |
          chmod +x scripts/migrations/lint-migration.sh
          bash scripts/migrations/lint-migration.sh

      - name: Zero-downtime assessment for changed migrations
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/migrations/check-zero-downtime.sh
          BASE="${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" -- '*.sql' \
            | grep "indexer/prisma/migrations/" || true)
          if [[ -z "$CHANGED" ]]; then
            echo "No migration SQL files changed in this PR."
            exit 0
          fi
          OVERALL=0
          while IFS= read -r f; do
            echo ""
            echo "────────────────────────────────────────────"
            bash scripts/migrations/check-zero-downtime.sh "$f" || OVERALL=1
          done <<< "$CHANGED"
          # Zero-downtime check is advisory only — does NOT block merge by
          # itself.  Blocking is enforced by lint-migration.sh (ERROR patterns).
          # The assessment report is surfaced in the PR run summary for review.
          exit 0

      - name: Verify example expand-contract migration passes linter
        run: |
          bash scripts/migrations/lint-migration.sh \
            indexer/prisma/migrations/20260827000000_example_expand_contract/migration.sql

  # ── Event schema coverage lint (Issue #488) ──────────────────────────────────
  # Fails when a Rust event struct in events.rs carries a `schema_version: u32`
  # field but the corresponding indexer schema registry entry is missing, is not
  # registered in SUPPORTED_SCHEMA_VERSIONS, or does not mark the
  # `schema_version` field as `optional: true`.
  #
  # How to fix a failure:
  #   1. Add the event type to SUPPORTED_SCHEMA_VERSIONS in
  #      indexer/src/event-schemas.ts.
  #   2. Add a ContractEventSchema constant with a
  #      { name: 'schema_version', type: 'number', optional: true } field entry.
  #   3. Register the schema in SCHEMA_REGISTRY.
  #   4. Add the Rust struct → eventType mapping to STRUCT_TO_EVENT_TYPE in
  #      scripts/lint-event-schemas.mjs.
  # See docs/guides/event-parsing.md §5 for the full versioning policy.
  event-schema-lint:
    name: Event Schema Coverage Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint event schema registry coverage
        run: node scripts/lint-event-schemas.mjs
