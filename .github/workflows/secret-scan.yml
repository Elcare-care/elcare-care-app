name: Secret Scanning

# Issue #537 — Add secret scanning to all CI paths.
# Issue #998 — Scan the built indexer image for secret material.
#
# Config: .gitleaks.toml (repo root) — extends gitleaks' default ruleset with
# custom rules for Stellar secret keys, database connection strings, Pinata
# tokens, and generic bearer/API tokens, plus an allowlist for clearly
# synthetic test fixtures. See SECURITY_SCANNING_TRIAGE.md for the triage /
# remediation process when this workflow fails.
#
# Coverage:
#   - `gitleaks` job: runs on every pull request (scoped to the PR's commits)
#     and on a weekly schedule (full commit history — "scan history where
#     permitted" per the issue). Same action/config either way; gitleaks-action
#     picks the scan scope from the triggering event.
#   - `gitleaks-docker-context` job: scans the indexer's Docker build context
#     (everything COPYed into indexer/Dockerfile, respecting .dockerignore
#     semantics via a plain filesystem scan of indexer/) so a secret baked
#     into a generated image can't slip past a source-only scan. This is a
#     pre-build filesystem scan rather than a scan of the built image's
#     layers.
#   - `gitleaks-docker-image` job (#998): builds the indexer image and scans
#     every layer of the exported tarball with gitleaks (`--no-git`). This
#     catches secrets that are NOT in the build context but could still end up
#     in a layer — e.g. a secret written during a RUN step via an ARG that
#     was not cleaned up, or a base-image layer change. The image is never
#     pushed; Docker BuildKit cache is used to keep build time low.
#
# Any non-allowlisted finding fails the job — findings never fail silently,
# and merge is blocked until triaged (see SECURITY_SCANNING_TRIAGE.md).

on:
  pull_request:
  schedule:
    # Weekly full-history scan. Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (repo scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: required so gitleaks-action can scope a PR scan to
          # exactly the PR's commits, and so the scheduled run can walk the
          # entire commit history rather than just the latest snapshot.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Only required for repos owned by a GitHub Organization; unset for
          # a personal-account repo. Add GITLEAKS_LICENSE as a repo/org
          # secret if this ever moves under an org and gitleaks-action starts
          # rejecting scans for lack of a license.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Deliberately not setting any "no redact" style flag — gitleaks'
          # default report/log output already truncates matched secrets, and
          # we want the job log to stay safe to paste into an issue.

  gitleaks-docker-context:
    name: Gitleaks (indexer Docker build context)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan indexer Docker build context
        # Filesystem (--no-git) scan of the indexer/ directory: everything
        # `docker build` would send as build context for indexer/Dockerfile
        # (COPY package*.json, prisma/, src/) minus what indexer/.dockerignore
        # already excludes (node_modules, dist, .env, prisma/migrations,
        # *.log — none of which are checked out here anyway). Catches a
        # secret before it can be baked into a generated image layer.
        #
        # `--redact` keeps the CLI's own console/report output from ever
        # printing a matched secret in full.
        run: |
          gitleaks detect \
            --no-git \
            --source indexer \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

  # Issue #998 — scan every layer of the built indexer image for secret
  # material. Runs after the pre-build context scan so the context scan still
  # catches secrets without requiring a Docker build. The image is built with
  # BuildKit, exported to a tarball via `docker save`, and each layer blob is
  # extracted and scanned with gitleaks in --no-git / --redact mode.
  #
  # This catches secrets that are NOT present in the checked-out source tree
  # but could still end up baked into a layer — e.g. a secret accidentally
  # written during a RUN step via an uncleared build ARG, an intermediate
  # file left behind by a script, or a base-image layer change.
  #
  # Verification: `indexer/src/__tests__/image-layer-scan-gate.fixture.ts`
  # is a clearly-labelled synthetic fixture that confirms the gate would
  # fire (and redact, not print) on a non-allowlisted finding. Its synthetic
  # value is allowlisted in .gitleaks.toml so normal CI passes; remove the
  # allowlist entry to verify the gate fires. The file itself is test-only
  # and contains no real or derivable credentials.
  gitleaks-docker-image:
    name: Gitleaks (indexer built-image layer scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build indexer image (scan only — never pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: indexer/Dockerfile
          push: false
          load: true
          tags: elcarehub-indexer:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=scan
            BUILD_DATE=${{ github.event.head_commit.timestamp || '1970-01-01T00:00:00Z' }}
            GIT_SHA=${{ github.sha }}

      - name: Export image to tarball
        run: docker save elcarehub-indexer:scan -o /tmp/indexer-image.tar

      - name: Extract image layers from tarball
        run: |
          mkdir -p /tmp/indexer-layers
          tar -xf /tmp/indexer-image.tar -C /tmp/indexer-layers

      - name: Extract layer blob contents
        # Each image layer is a tar-within-a-tar. We extract every layer.tar
        # blob into its own subdirectory so gitleaks can walk the actual
        # filesystem tree as it would exist inside the running container.
        run: |
          mkdir -p /tmp/indexer-layer-contents
          find /tmp/indexer-layers -name 'layer.tar' | while read -r layer; do
            layer_dir="/tmp/indexer-layer-contents/$(basename "$(dirname "$layer")")"
            mkdir -p "$layer_dir"
            # --ignore-zeros tolerates sparse/empty tarballs from whiteout-only
            # layers (deleted files); errors in individual layers are non-fatal
            # so a single malformed layer doesn't abort the full scan.
            tar -xf "$layer" -C "$layer_dir" --ignore-zeros 2>/dev/null || true
          done

      - name: Scan extracted layer contents for secrets
        # --redact ensures matched values are never printed in CI logs, only
        # their rule IDs and redacted positions. --exit-code 1 fails the job
        # on any non-allowlisted finding, blocking merge.
        run: |
          gitleaks detect \
            --no-git \
            --source /tmp/indexer-layer-contents \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

      - name: Clean up image artefacts
        if: always()
        run: |
          rm -f /tmp/indexer-image.tar
          rm -rf /tmp/indexer-layers /tmp/indexer-layer-contents
          docker rmi elcarehub-indexer:scan --force || true
